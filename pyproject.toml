[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemeq-grader"
version = "0.1.0"
description = "拍照批改高中化学方程式，按姓名/学号登记错题并生成报告"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ChemEq Grader contributors" }]
keywords = ["chemistry", "education", "grading", "ocr", "llm", "workbuddy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "openpyxl>=3.1",
  "qrcode[pil]>=7.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "mcp>=1.2",
  "python-docx>=1.2.0",
]

[project.scripts]
chemeq = "chemeq.cli:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.22.3",
  "pytest>=8.3",
  "python-docx>=1.2.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chemeq"]

[tool.hatch.build.targets.sdist]
include = ["src/chemeq", "README.md", "LICENSE", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
